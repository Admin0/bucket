<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="description" content="Commit Today, Green Tomorrow. with Kermit the frog 🐸. 아웃도어 액티비티를 기록해서 작고 소중한 잔디밭을 가꾸어요." />
        <title>#잔디심기 🌱</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <link rel="icon" href="imgs/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="imgs/icon-256.png" type="image/x-icon" />
        <link rel="preload" href="https://fonts.gstatic.com/s/materialsymbols/v43/d6lekb-sS9m3-i1LgQNcsFOOuLQXvG55_bpeDM1CWRsbxki3.woff2" as="font" type="font/woff2" crossorigin> <!-- 'Material Symbols -->
        <link rel="preload" href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v315/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2" as="font" type="font/woff2" crossorigin> <!-- 'Material Symbols Outlined -->
        <link rel="stylesheet" href="style.css" />
        <link rel="manifest" crossorigin="use-credentials" href="manifest.json" />
        <script src="script_records.js"></script>
        <script src="script.js"></script>
        <script src="script_gpx.js"></script>
        <script src="script_calendar.js"></script>
        <script src="script_stats.js"></script>
    </head>

    <body id="잔디심기">
        <div id="title">
            <h1>#잔디심기 🌱</h1>
        </div>

        <header id="stats-header">
            <div class="stat-item">
                <span class="label">거리</span>
                <span id="total-distance" class="value">0 km</span>
            </div>
            <div class="stat-item">
                <span class="label">러닝 거리</span>
                <span id="total-running-distance" class="value">0 km</span>
            </div>
            <div class="stat-item">
                <span class="label">트레일 상승고도</span>
                <span id="total-trail-elevation" class="value">0 m</span>
            </div>
            <div class="stat-item">
                <span class="label">활동</span>
                <span id="total-record-count" class="value">0</span>
            </div>
        </header>

        <div id="main-container">
            <div class="racetrack">
                <div class="track-lane">
                    <h2>FULL</h2>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-full"></div>
                </div>
                <div class="track-lane">
                    <h2>HALF</h2>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-half"></div>
                </div>
                <div class="track-lane">
                    <h2>10K</h2>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-10k"></div>
                </div>
                <div class="track-lane">
                    <h2>5K</h2>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-5k"></div>
                </div>
            </div>
            <div class="racetrack">
                <div class="track-lane">
                    <h2>TRAIL</h2>
                    <div id="trail-filter-container">
                        <label title="상승 고도 (기본)"><input type="radio" name="trail-filter" value="elevation" checked /> m ↑</label>
                        <label title="상승 고도 페이스"><input type="radio" name="trail-filter" value="elevation_pace" /> /m ↑</label>
                        <label title="거리"><input type="radio" name="trail-filter" value="distance" /> km</label>
                        <label title="거리 페이스"><input type="radio" name="trail-filter" value="distance_pace" /> /km</label>
                    </div>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-trail"></div>
                </div>
            </div>
        </div>

        <div id="calendar-container">
            <h2>DETAILS</h2>
            <div class="filters">
                <!-- <div class="filters" onclick="location.href='#calendar-container'"> -->
                <fieldset>
                    <legend>필터</legend>
                    <span id="calendar-year-filter-container" class="filter">
                        <label title="전체"><input type="radio" name="calendar-year" value="all" /><span class="material-symbols-outlined"> calendar_month </span></label>
                        <label title="최근"><input type="radio" name="calendar-year" value="recent" checked /><span class="material-symbols-outlined"> event </span></label>
                    </span>
                    <span class="div"></span>
                    <span id="calendar-view-filter-container" class="filter">
                        <label title="일반"><input type="radio" name="calendar-view" value="normal" checked /><span class="material-symbols-outlined"> view_agenda </span></label>
                        <label title="컴팩트"><input type="radio" name="calendar-view" value="compact" /><span class="material-symbols-outlined"> view_module </span></label>
                    </span>
                </fieldset>
            </div>
            <div id="calendar-grid"></div>
        </div>


        <div id="stats-container">
            <h2>STASTATICS</h2>
            <div id="stats-grid">
                <h2>STASTATICS</h2>
            </div>
        </div>

        <div id="table-container">
            <h2>RECORDS</h2>
            <div class="filters">
                <fieldset>
                    <legend>필터</legend>
                    <label id="reset-filters" title="초기화"><span class="material-symbols-outlined"> replay </span></label>
                    <span class="div"></span>
                    <span id="type-filter-container" class="filter">
                        <label title="전체"><input type="radio" name="type" value="all" checked /><span class="material-symbols-outlined"> done_all </span></label>
                        <label title="러닝"><input type="radio" name="type" value="run" /><span class="material-symbols-outlined"> directions_run </span></label>
                        <label title="걷기"><input type="radio" name="type" value="walk" /><span class="material-symbols-outlined"> directions_walk </span></label>
                        <label title="트레일"><input type="radio" name="type" value="trail" /><span class="material-symbols-outlined"> hiking </span></label>
                    </span>
                    <span class="div"></span>
                    <span id="course-filter-container" class="filter">
                        <label title="전체"><input type="radio" name="course" value="all" checked /><span class="material-symbols-outlined"> straighten </span></label>
                        <label title="5K"><input type="radio" name="course" value="5k" /><span class="material-symbols-outlined"> timer_5_shutter </span></label>
                        <label title="10K"><input type="radio" name="course" value="10k" /><span class="material-symbols-outlined"> timer_10 </span></label>
                        <label title="Half"><input type="radio" name="course" value="half" /><span class="material-symbols-outlined"> contrast </span></label>
                        <label title="full"><input type="radio" name="course" value="full" /><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1"> circle </span></label>
                    </span>
                    <span class="div"></span>
                    <span id="year-filter-container" class="filter">
                        <label title="전체"><input type="radio" name="year" value="all" checked /><span class="material-symbols-outlined"> calendar_month </span></label>
                    </span>
                    <span class="div"></span>
                    <label title="검색"><span class="material-symbols-outlined"> search </span><input type="search" id="search-input" placeholder="Search..." /></label>
                </fieldset>
            </div>
            <table id="records-table">
                <thead>
                    <tr>
                        <th data-sort="course"><span class="material-symbols-outlined"> directions_run </span><span class="text">종목</span></th>
                        <th data-sort="date"><span class="material-symbols-outlined"> event </span><span class="text">날짜</span></th>
                        <th data-sort="title"><span class="material-symbols-outlined"> flag </span><span class="text">대회/장소</span></th>
                        <th data-sort="isOfficial"><span class="material-symbols-outlined"> star_rate </span><span class="text">공식/비공식</span></th>
                        <th data-sort="distance"><span class="material-symbols-outlined"> route </span><span class="text">거리/높이</span></th>
                        <th data-sort="record"><span class="material-symbols-outlined"> timer </span><span class="text">기록</span></th>
                        <th data-sort="pace"><span class="material-symbols-outlined"> speed </span><span class="text">페이스</span></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <footer>
            <a href="//www.instagram.com/jinh.kr/" class="i o" title="러닝개굴의 본체 인스타그램 바로가기">
                <img style="opacity: 0.65" src="../img/icon_instragram.svg" alt="" />
            </a>
            <a href="earth" class="i" title="하위 프로젝트: 🌏 earth">🌏 earth</a>
            <a href="../#잔디심기" class="i" title="상위 프로젝트: 버킷리스트">#버킷리스트</a>
            <a href="../블랙야크/" class="i" title="자매 프로젝트: 블랙야크">/블랙야크/</a>
            <!-- <a href="map" class="i" title="하위 프로젝트: 잔디지도">/지도 🗺️/</a> -->
            <a href="//jinh.kr/" class="i" title="개구리의 코딩 포트폴리오">//jinh.kr/</a>
        </footer>

        <div id="tooltip"></div>
    </body>
</html>
