<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>#잔디심기 🌏 earth</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon" />
        <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }
            #map {
                height: 100vh;
            }

            /* --- 프로그레스 바 스타일 --- */
            #progress-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                z-index: 1001;
                background-color: transparent;
                transition: opacity 0.5s ease-out;
            }

            #progress-bar {
                width: 0%;
                height: 100%;
                background-color: #00ff7f;
                box-shadow: 0 0 10px #00ff7f, 0 0 5px #00ff7f;
                transition: width 0.2s ease-out;
            }

            /* --- 진행률 카운터 스타일 --- */
            #gpx-counter {
                position: fixed;
                top: 8px;
                z-index: 1000;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 4px 10px;
                border-radius: 12px;
                font-size: 12px;
                font-weight: bold;
                white-space: nowrap;
                box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
                transition: opacity 0.5s ease-out, left 0.2s ease-out, transform 0.2s ease-out;
                transform: translateX(-100%);
            }

            /* --- 커스텀 컨트롤 버튼 그룹 스타일 --- */
            .custom-controls {
                position: fixed;
                top: 11.6em; /* NavigationControl 바로 아래에 위치 */
                right: 10px;
                z-index: 1001;
            }

            /* 활성 상태 버튼 스타일 */
            .custom-controls button.active {
                fill: #33b5e5;
            }
            
            /* --- 디버그 패널 스타일 --- */
            #debug-panel {
                position: fixed;
                top: 18em;
                right: 10px;
                background: rgba(0,0,0,0.7);
                color: white;
                padding: 10px;
                border-radius: 5px;
                font-size: 12px;
                max-height: 200px;
                overflow-y: auto;
                display: none; /* 기본적으로 숨김 */
            }
        </style>
    </head>
    <body>
        <div id="progress-container">
            <div id="progress-bar"></div>
            <div id="gpx-counter">0%</div>
        </div>
        <div id="map"></div>

        <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js" defer></script>
        <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
        <script src="../script_records.js" defer></script>
        <script src="script.js" defer></script>
    </body>
</html>
