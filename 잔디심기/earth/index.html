        <title>./잔디어스 🌏/</title>
        <!-- 라이브러리 버전을 최신으로 업데이트 -->
        <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }
            #map {
                height: 100vh;
            }

            /* --- 프로그레스 바 스타일 --- */
            #progress-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 4px;
                z-index: 1001;
                background-color: transparent;
                transition: opacity 0.5s ease-out;
            }

            #progress-bar {
                width: 0%;
                height: 100%;
                background-color: #00ff7f;
                box-shadow: 0 0 10px #00ff7f, 0 0 5px #00ff7f;
                transition: width 0.2s ease-out;
            }

            /* --- 진행률 카운터 스타일 --- */
            #gpx-counter {
                position: fixed;
                top: 8px;
                left: 50%; /* 초기 위치, JS로 업데이트 됨 */
                transform: translateX(-50%);
                z-index: 1000;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 4px 10px;
                border-radius: 12px;
                font-size: 12px;
                font-weight: bold;
                white-space: nowrap;
                box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
                transition: opacity 0.5s ease-out, left 0.2s ease-out, transform 0.2s ease-out;
            }
            
            /* --- 테마 스위처 스타일 --- */
            #theme-switcher {
                position: fixed;
                top: 80px; /* maplibregl.NavigationControl 아래에 위치 */
                right: 10px;
                z-index: 1001;
            }
        </style>
    </head>
