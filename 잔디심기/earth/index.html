<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>#잔디심기 🌏 earth</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preload" href="https://fonts.gstatic.com/s/materialsymbols/v43/d6lekb-sS9m3-i1LgQNcsFOOuLQXvG55_bpeDM1CWRsbxki3.woff2" as="font" type="font/woff2" crossorigin> <!-- 'Material Symbols -->
    <link rel="preload" href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v315/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2" as="font" type="font/woff2" crossorigin> <!-- 'Material Symbols Outlined -->
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
        <!-- <div id="gpx-counter">0%</div> -->
    </div>

    <div id="map"></div>

    <div id="route-search" class="">
        <label for="route-search-input" class="material-symbols" title="검색">search</label>
        <input id="route-search-input" type="search" placeholder="경로 검색" autocomplete="off">
        <button id="gpx-upload-btn" class="item material-symbols" title="GPX 업로드">upload</button>

        <div id="route-search-filter" class="">
            <ol>
                <li>
                    <span class="item" data-filter="run"><span class="material-symbols icon"> directions_run </span>러닝</span>
                    <ul>
                        <li class="item" data-filter="walk"><span class="material-symbols icon"> directions_walk </span>걷기</li>
                        <li class="item" data-filter="#서해랑길, #남파랑길, #해파랑길, #DMZ평화의길"><span class="material-symbols icon"> mode_of_travel </span>코리아둘레길</li>
                        <li class="item" data-filter="#경기둘레길"><span class="material-symbols icon"> mode_of_travel </span>경기둘레길</li>
                        <li class="item" data-filter="#경기옛길"><span class="material-symbols icon"> mode_of_travel </span>경기옛길</li>
                        <li class="item" data-filter="#여강길"><span class="material-symbols icon"> mode_of_travel </span>여강길</li>
                    </ul>
                </li>
                <li>
                    <span class="item" data-filter="trail"><span class="material-symbols icon"> hiking </span>등산/트레일러닝</span>
                    <ul>
                        <li class="item" data-filter="명산100 NOT 명산100+"><span class="material-symbols icon"> landscape </span>명산100</li>
                        <li class="item" data-filter="명산100+"><span class="material-symbols icon"> landscape </span>명산100+</li>
                        <li class="item" data-filter="#영남알프스"><span class="material-symbols icon"> landscape </span>영남알프스</li>
                        <li class="item" data-filter="#금북정맥"><span class="material-symbols icon"> landscape </span>금북정맥</li>
                    </ul>
                </li>
                <li>
                    <span class="item" data-filter="NOT @"><span class="material-symbols icon"> emoji_people </span>개인</span>
                    <ul>
                        <li class="item" data-filter="@"><span class="material-symbols icon"> groups </span>단체</li>
                    </ul>
                </li>
            </ol>
        </div>

    </div>

    <div id="gpx-list-view-toggle"><span class="icon material-symbols"></span><span class="label"></span></div>

    <div id="gpx-list-container" class="on">
        <ul></ul>
        <div id="export-controls">
            <button id="export-button">내보내기</button>
        </div>
        <div id="export-output"></div>
    </div>
    <div id="tooltip"></div>

    <!-- <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js" defer></script> -->
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js" defer></script>
    <script src="https://tiles.versatiles.org/assets/lib/versatiles-style/versatiles-style.js" defer></script>
    <script src="../script_records.js" defer></script>
    <script src="script_records_4_earth.js" defer></script>
    <script type="module" src="script.js" defer></script>
    <script type="module" src="../script_tooltip.js" defer></script>
    <script type="module" src="script_gpx.js" defer></script>
</body>

</html>
