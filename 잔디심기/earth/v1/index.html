<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX 지도 표시</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #map { height: 100vh; }

        /* --- 프로그레스 바 스타일 --- */
        #progress-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            z-index: 1001;
            background-color: transparent;
            transition: opacity 0.5s ease-out;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00ff7f;
            box-shadow: 0 0 10px #00ff7f, 0 0 5px #00ff7f;
            transition: width 0.2s ease-out;
        }

        /* --- 진행률 카운터 스타일 (수정됨) --- */
        #gpx-counter {
            position: fixed;
            top: 8px; /* 프로그레스 바 바로 아래 위치 */
            left: 0;  /* JavaScript가 이 값을 업데이트 */
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 12px; /* 둥근 모양 */
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap; /* 텍스트가 한 줄로 표시되도록 */
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            /* 위치와 투명도에 대한 부드러운 전환 효과 */
            transition: opacity 0.5s ease-out, left 0.2s ease-out, transform 0.2s ease-out;
            transform: translateX(0%); /* JS가 위치 보정을 위해 이 값을 업데이트 */
        }
    </style>
</head>
<body>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="map"></div>
    <div id="gpx-counter">0 / 0</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="../../script_records.js"></script>
    <script src="script.js"></script>
</body>
</html>
