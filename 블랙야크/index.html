<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <title>#블랙야크: BAC 명산100 프로그램 도전</title>
        <link rel="icon" href="./favicon.ico" type="image/x-icon" />
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="stylesheet" type="text/css" href="style_page.css" />
        <link rel="stylesheet" type="text/css" href="style_page_dark.css" />
        <script defer src="script.js"></script>
        <script defer src="script_page.js"></script>
        <script defer src="script_table-sort.min.js"></script>
    </head>
    <body id="블랙야크">
        <header>
            <div class="profile"></div>
            <h1>#블랙야크<span class="sub">: BAC 명산100 프로그램 도전</span></h1>
        </header>

        <div class="tape"></div>

        <div id="tooltip" class=""></div>

        <div id="블랙야크_canvas" class=""></div>
        <p id="블랙야크_p">완료:</p>

        <table id="블랙야크_table" class="table-sort">
            <thead>
                <tr>
                    <td class="no" onclick="sortClass(`no`)">#</td>
                    <td class="name" onclick="sortClass(`no`)">이름</td>
                    <td class="peak" onclick="sortClass(`height`)">정상</td>
                    <td class="height" onclick="sortClass(`height`)">높이 (m)</td>
                    <td class="done" onclick="sortClass(`step`)">완료</td>
                    <td class="step" onclick="sortClass(`step`)">순서</td>
                </tr>
            </thead>
            <tbody id="블랙야크_tbody"></tbody>
        </table>

        <footer>
            <a href="//www.instagram.com/jinh.kr/" class="i o" title="등산개굴의 본체 인스타그램 바로가기">
                <img style="opacity: .65;" src="./img/icon_instragram.svg" alt="">
            </a>
            <a href="//jinh.kr/bucket/#블랙야크" class="i" title="상위 프로젝트: 버킷리스트">#버킷리스트</a>
            <a href="//jinh.kr/" class="i" title="개구리의 코딩 포트폴리오">//jinh.kr/</a>
            <a href="//bac.blackyak.com/BAC/ChallengeProgram/114" class="i o" title="명산100 소개 페이지(공식)">명산100 (BAC)</a>
        </footer>
    </body>
</html>
