<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#헤르메스</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>#PROJECT HERMES: Running Records Track</h1>
    <div class="racetrack">
        <div class="track-lane">
            <h2>FULL</h2>
            <div class="best-record-container"></div>
            <div class="track" id="track-full"></div>
        </div>
        <div class="track-lane">
            <h2>HALF</h2>
            <div class="best-record-container"></div>
            <div class="track" id="track-half"></div>
        </div>
        <div class="track-lane">
            <h2>10K</h2>
            <div class="best-record-container"></div>
            <div class="track" id="track-10k"></div>
        </div>
        <div class="track-lane">
            <h2>5K</h2>
            <div class="best-record-container"></div>
            <div class="track" id="track-5k"></div>
        </div>
        <div class="track-lane">
            <h2>TRAIL</h2>
            <div class="best-record-container"></div>
            <div class="track" id="track-trail"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
