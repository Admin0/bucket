<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#ABC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="title">
        <h1>Activity Board of Commit</h1>
    </div>

    <div id="main-container">
        <div class="racetrack">
            <div class="track-lane">
                <h2>FULL</h2>
                <div class="best-record-container"></div>
                <div class="track" id="track-full"></div>
            </div>
            <div class="track-lane">
                <h2>HALF</h2>
                <div class="best-record-container"></div>
                <div class="track" id="track-half"></div>
            </div>
            <div class="track-lane">
                <h2>10K</h2>
                <div class="best-record-container"></div>
                <div class="track" id="track-10k"></div>
            </div>
            <div class="track-lane">
                <h2>5K</h2>
                <div class="best-record-container"></div>
                <div class="track" id="track-5k"></div>
            </div>
        </div>
        <div class="racetrack">
            <div class="track-lane">
                <h2>TRAIL</h2>
                <div id="trail-track-container">
                    <div id="trail-filter-container">
                        <label><input type="radio" name="trail-filter" value="elevation" checked> m ↑</label>
                        <label><input type="radio" name="trail-filter" value="elevation_pace"> /m ↑</label>
                        <label><input type="radio" name="trail-filter" value="distance"> km</label>
                        <label><input type="radio" name="trail-filter" value="distance_pace"> /km</label>
                    </div>
                    <div class="best-record-container"></div>
                    <div class="track" id="track-trail"></div>
                </div>
            </div>
        </div>
    </div>


    <div id="table-container">
        <h2>RECORDS</h2>
        <div id="filters">
            <fieldset>
                <legend>필터</legend>
                <button id="reset-filters">초기화</button>
                <span>|</span>
                <span id="type-filter-container" class="filter">
                    <label><input type="radio" name="type" value="all" checked> 전체</label>
                    <label><input type="radio" name="type" value="run"> 러닝</label>
                    <label><input type="radio" name="type" value="trail"> 트레일</label>
                </span>
                <span id="course-filter-container" class="filter">
                    <span>|</span>
                    <label><input type="radio" name="course" value="all" checked> 전체</label>
                    <label><input type="radio" name="course" value="5k"> 5K</label>
                    <label><input type="radio" name="course" value="10k"> 10K</label>
                    <label><input type="radio" name="course" value="half"> Half</label>
                    <label><input type="radio" name="course" value="full"> Full</label>
                </span>
                <span id="year-filter-container" class="filter">
                    <span>|</span>
                    <label><input type="radio" name="year" value="all" checked> 전체</label>
                </span>
            </fieldset>
        </div>
        <table id="records-table">
            <thead>
                <tr>
                    <th data-sort="course"><span class="material-symbols-outlined"> directions_run </span><span class="text">종목</span></th>
                    <th data-sort="date"><span class="material-symbols-outlined"> event </span><span class="text">날짜</span></th>
                    <th data-sort="title"><span class="material-symbols-outlined"> flag </span><span class="text">대회/장소</span></th>
                    <th data-sort="isOfficial"><span class="material-symbols-outlined"> star_rate </span><span class="text">공식/비공식</span></th>
                    <th data-sort="distance"><span class="material-symbols-outlined"> route </span><span class="text">거리/높이</span></th>
                    <th data-sort="record"><span class="material-symbols-outlined"> timer </span><span class="text">기록</span></th>
                    <th data-sort="pace"><span class="material-symbols-outlined"> speed </span><span class="text">페이스</span></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <div id="tooltip"></div>
    <script src="script_records.js"></script>
    <script src="script.js"></script>
</body>

</html>
